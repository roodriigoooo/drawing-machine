<foreignObject x="0" y="212" width="920" height="115.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 8.</em> Five CPU draws × 256 samples from one checkpoint per arm at top-k 40, temperature 1, raw model support; one shared reference and one shared floor. Bars are the draw-to-draw spread; the grey band is what <b>real drawings</b> score at the same two set sizes, which is the only thing that makes these numbers readable — coverage's ceiling is not 1, mmd is in this corpus's pixels, and nna's textbook 0.5 holds only when the sets are the same size. <b>The robust reversal: flat arm is best on fidelity and worst on coverage; both planners reverse that trade, while AR composition beats diffusion on mmd and nna. Exact planner coverage rank is unresolved.</b> That trade is the whole reason three numbers are reported instead of one, and it is invisible in any of them alone.</div></foreignObject>
