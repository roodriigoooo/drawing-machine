<foreignObject x="0" y="268" width="670" height="150.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 7.</em> The transform tier's device cost, compiled for Cortex-M0+ at <code>-Os</code> and read off <code>-fstack-usage</code> and <code>size</code>. Left: peak stack is linear in the depth bound at <b>12 bytes per scope</b> — the size of one transform — so the knob <code>docs/direction.md</code> §2.6 reaches for has a price per turn. Right: the same builds in the flash–stack plane. <b>Composing by value costs 56 bytes of flash and 36 of stack against composing through pointers — the same stack as 3 extra scopes would buy</b>, and it is strictly dominated: everything in the shaded rectangle is cheaper on both axes at once. The sweep also shows the two costs are not interchangeable — depth buys stack at almost no flash, so a budget problem on one axis cannot be paid for on the other.</div></foreignObject>
