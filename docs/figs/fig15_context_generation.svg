<foreignObject x="0" y="300" width="964" height="185.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 15.</em> <b>A controlled prefix change moves the conditional distribution by a lot, and moves what the model emits by a little.</b> Left: teacher-forced Δ, the four-way symmetric contrast minus its matched donor control, at +4.28 / +4.72 bits per target byte on the composed venue and +1.33 / +1.28 on the step venue, with both component intervals excluding zero. Middle: the same checkpoints prompted at the same boundary and left to decode, paired on one shared block of uniforms — the preference survives, an order of magnitude smaller in a unit that cannot be compared to the left panel and is not. The grey dot is the matched irrelevant prefix edit, which moves the completions by &#8722;0.003 to +0.001 on every row: what the completions follow is the relation, not the fact that the prefix changed. <b>Right is what stops the middle panel being over-read:</b> on the composed venue a positive, interval-excludes-zero preference sits on 1.3% / 1.1% of draws actually producing the compatible continuation. The preference is real and the capability is not there. The two diagnostic rows fail for different reasons and only one of them is about the relation: the y-axis twins are readable (prefix cost ×1.34) and flat, while the exact quarter turn costs the model ×2.2–2.4 its own prefix rate, so its null is about the shift and not about the relation. Two checkpoints per venue are not a population; every number here is conditional on the named ones.</div></foreignObject>
</svg>