<foreignObject x="0" y="252" width="470" height="97.5"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 3.</em> Within the trained counts the two seeds agree to 0.03 bits/symbol; one copy past the bound they differ by 0.53 and then 0.94. The copy mechanism is a property of the model, the count prior is a property of the seed — so the break's location replicates and its depth does not. Neither seed rises above the unrepeated-body rate.</div></foreignObject>
