<foreignObject x="0" y="258" width="1000" height="167.5"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 14.</em> <b>Asking for a class produces that class's geometry, by a wider margin than real drawings of it achieve — and the same overshoot is why the other two columns stop short.</b> 5 draws × 100 samples per class per seed, every set scored against a fixed 100-drawing reference of real val drawings. <b>Left:</b> the diagonal is the row minimum in 48 of 50 class-draws, and its margin over the nearest confusing class exceeds the corpus's own at all five classes and both seeds (1.08–3.27×) — the grey block is the margin a perfect generator gets, and the model is outside it. <b>Right:</b> against the unconditional arm on the identical references, the label closes 43% of the coverage gap to the floor and 61% of the nna gap, and no class reaches either. <b>All three misses point the same way:</b> samples sit in each class's typical middle, so they separate the classes better than real drawings do, reach fewer distinct real drawings, and stay more distinguishable from them — one mode-seeking signature at a shared top-k of 40, not three results. A later no-training sweep shows that concentration is strongly top-k-sensitive at s0: k=80 moves coverage 0.406→0.487 and nna 0.639→0.549; full support then worsens fidelity/separation and emits one empty. <code>mmd</code> is the one column with no gap left: 13.76 against a 13.79 floor, within 0.22 px at every class.</div></foreignObject>
</svg>