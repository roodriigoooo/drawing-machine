<foreignObject x="0" y="248" width="720" height="80.0"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 2.</em> Left: every arm is still descending at 24,000 steps, so no absolute total is an asymptote. Right: the planner's gap over the flat arm, each rung differenced against the baseline at its own budget (coloured) and against a single 24,000-step baseline (grey). The grey line closes at 8 bits per doubling; the real one does not close at all, and on the AR-composition arm it widens.</div></foreignObject>
