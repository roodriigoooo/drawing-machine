<foreignObject x="0" y="280" width="900" height="97.5"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:'Latin Modern Roman','Computer Modern Roman',Georgia,'Times New Roman',serif;font-size:12.5px;line-height:1.45;color:#1a1a1a;"><em>Figure 1.</em> Run-04 demonstrated-affine package, stored rows only. (a) Summed NLL of the correct d4/dx/dy values at the prompt boundary; lower means more transform information. Each I1 fit tuple is determined by its first motif, so fit cells can succeed by lookup; I2 pilot cells, where each motif appears with eight tuples, stay near the demonstration-blind prior. (b) The same measure on final held-out positives beside the training-marginal prior. (c) The prompt gate separates generic programs but not broken demonstrations. Two seeds, descriptive; no intervals or qualification.</div></foreignObject>
